name: Resolve Code Review Issues Check

on:
  issues:
    types: [closed]

jobs:
  unblock-pr:
    # Only run for issues auto-generated by the code reviewer
    if: contains(github.event.issue.labels.*.name, 'code-review')
    runs-on: ubuntu-latest

    permissions:
      issues: read
      statuses: write
      pull-requests: read

    steps:
      - name: Extract PR number from issue body
        id: extract
        run: |
          PR_NUM=$(echo "${{ github.event.issue.body }}" | grep -oP 'PR #\K[0-9]+' | head -1)
          if [ -z "$PR_NUM" ]; then
            echo "No PR number found in issue body — skipping"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
          else
            echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
          fi

      - name: Check remaining open issues for this PR
        if: steps.extract.outputs.pr_number != ''
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const prNum = parseInt('${{ steps.extract.outputs.pr_number }}', 10);

            // Fetch all open issues labelled 'code-review' (max 100; enough for any PR)
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'code-review',
              state: 'open',
              per_page: 100,
            });

            const remaining = openIssues.filter(i =>
              i.body && i.body.includes(`PR #${prNum}`)
            );

            core.info(`Open code-review issues for PR #${prNum}: ${remaining.length}`);
            core.setOutput('remaining', remaining.length.toString());

            // Retrieve the PR's head SHA so we can update the correct commit status
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNum,
            });
            core.setOutput('head_sha', pr.head.sha);

      - name: Update commit status when all issues resolved
        if: |
          steps.extract.outputs.pr_number != '' &&
          steps.check.outputs.remaining == '0'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.check.outputs.head_sha }}',
              state: 'success',
              description: 'All code review issues have been resolved',
              context: 'code-review/issues',
            });
            core.info('Commit status updated to success — PR is now unblocked');

      - name: Leave status pending when issues remain
        if: |
          steps.extract.outputs.pr_number != '' &&
          steps.check.outputs.remaining != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const remaining = parseInt('${{ steps.check.outputs.remaining }}', 10);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.check.outputs.head_sha }}',
              state: 'pending',
              description: `${remaining} code review issue(s) must be resolved before merging`,
              context: 'code-review/issues',
            });
            core.info(`${remaining} issue(s) still open — PR remains blocked`);
