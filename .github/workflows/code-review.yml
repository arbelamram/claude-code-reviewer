name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number
      owner:
        description: 'Repository owner'
        required: false
        type: string
      repo:
        description: 'Repository name'
        required: false
        type: string

jobs:
  code-review:
    runs-on: ubuntu-latest
    
    permissions:
      pull-requests: write
      contents: read
      issues: write
      statuses: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Project
        run: npm run build

      - name: Run Claude Code Review
        env:
          GITHUB_OWNER: ${{ inputs.owner || github.repository_owner }}
          GITHUB_REPO: ${{ inputs.repo || github.event.repository.name }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run review